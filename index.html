
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENELA | Portal das Menetécnicas</title>
<meta name="theme-color" content="#ad4c77">
<style>
:root{--rosa:#ad4c77;--claro:#f8eaf0;--linha:#ebdfe6;--texto:#34242e;--cinza:#806b78}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fbf8fa;color:var(--texto)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5}
.layout{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
aside{background:white;border-right:1px solid var(--linha);padding:24px 14px}
.logo{font-size:32px;color:var(--rosa);font-weight:900;margin:0}
.sublogo{font-size:10px;letter-spacing:2px;color:var(--rosa)}
nav{display:grid;gap:7px;margin-top:30px}
nav button{border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;color:#66535d;font-weight:bold}
nav button:hover,nav button.active{background:var(--claro);color:var(--rosa)}
main{padding:26px;min-width:0}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:28px;margin:5px 0}
h2{font-size:20px}
p{line-height:1.5}
.muted{color:var(--cinza)}
.small{font-size:12px}
.card,.stat{background:white;border:1px solid var(--linha);border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{margin:0}
.stat b{display:block;font-size:26px;margin-top:8px}
.stat span{font-size:12px;color:var(--cinza)}
.hero{background:linear-gradient(110deg,#b65a82,#8b3660);color:white;border-radius:18px;padding:24px;margin-bottom:18px}
.hero h2{margin:0}
.hero p{color:#ffe4f0}
.btn{background:var(--rosa);color:white;border:0;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:bold}
.btn.alt{background:var(--claro);color:#914064}
.btn.out{background:white;border:1px solid #dcbdcb;color:var(--rosa)}
.actions,.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar{margin:15px 0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label,.login label{display:grid;gap:7px;font-size:13px;font-weight:bold}
.full{grid-column:1/-1}
input,select,textarea{border:1px solid #decbd6;border-radius:9px;background:white;padding:12px;width:100%;color:var(--texto)}
textarea{min-height:95px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #d7a3bb}
.check{display:flex!important;align-items:center;gap:8px!important}
.check input{width:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--linha);font-size:12px}
th{color:var(--cinza)}
.tablebox{overflow:auto}
.tag{display:inline-block;padding:6px 9px;background:var(--claro);border-radius:20px;font-size:11px;color:#98486e}
.tag.ok{background:#e4f4eb;color:#207450}
.row{padding:13px 0;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;gap:12px;align-items:center}
.row:last-child{border:0}
.note{background:var(--claro);border-radius:10px;padding:14px;color:#795568;font-size:13px;margin-bottom:14px}
.warning{background:#fff6df;border-radius:10px;padding:14px;color:#76561a;margin-bottom:14px}
.empty{border:1px dashed #dcbfce;border-radius:12px;padding:25px;text-align:center;color:var(--cinza)}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#fbeff4,#f0d8e3)}
.login{width:min(460px,100%);background:white;border-radius:18px;padding:28px}
.login form{display:grid;gap:13px}
.login h1{color:var(--rosa);font-size:34px}
.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.week span{text-align:center;font-size:11px;color:var(--cinza);padding:7px}
.day{min-height:85px;background:white;border:1px solid var(--linha);border-radius:8px;padding:7px;text-align:left;font-size:12px;overflow:hidden}
.day.selected{background:var(--claro);border-color:var(--rosa)}
.day small{display:block;margin-top:5px;font-size:10px;background:var(--claro);padding:3px;overflow-wrap:anywhere}
.toast{position:fixed;bottom:18px;right:18px;background:#34242e;color:white;padding:14px;border-radius:10px;display:none;max-width:350px;z-index:10;font-size:13px}
footer{font-size:11px;color:var(--cinza);margin-top:24px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:730px){
.layout{display:block}
aside{padding:15px}
nav{display:flex;overflow:auto;margin-top:12px}
nav button{white-space:nowrap}
main{padding:18px 14px}
.grid,.form{grid-template-columns:1fr}
.day{min-height:58px;padding:3px}
.day small{font-size:8px}
}
</style>
</head>

<script>

/* LOGIN E CADASTRO */

function authScreen(){
 const signup = mode==="signup";
 const reset = mode==="reset";
 const recovery = mode==="recovery";

 $("app").innerHTML = `
 <div class="loginwrap">
 <div class="login">
 <h1>MENELA</h1>
 <p class="small muted">PORTAL DM & MENETÉCNICAS</p>
 <h2>${
 signup?"Criar minha conta":
 reset?"Recuperar senha":
 recovery?"Definir nova senha":
 "Entrar no portal"
 }</h2>

 <form id="authForm">
 ${recovery?"":`
 <label>E-mail
 <input type="email" name="email" required
 value="${h(authEmail)}" autocomplete="email">
 </label>`}

 ${signup?`
 <label>Nome completo
 <input name="name" required minlength="3"
 maxlength="100" autocomplete="name">
 </label>
 <label>Últimos 4 dígitos do CPF
 <input name="cpf_last4" type="text"
 inputmode="numeric" pattern="[0-9]{4}"
 maxlength="4" minlength="4"
 autocomplete="off" placeholder="Ex.: 1234" required>
 </label>
 <p class="small muted">
 Utilizados somente para conferir a prova.
 Não são sua senha. Não informe o CPF completo.
 </p>`:""}

 ${reset?"":`
 <label>${recovery?"Nova senha":"Senha"}
 <input type="password" name="password"
 minlength="8" required
 autocomplete="${signup||recovery?"new-password":"current-password"}">
 </label>`}

 <button class="btn" type="submit">
 ${signup?"Cadastrar":reset?"Enviar recuperação":
 recovery?"Salvar senha":"Entrar"}
 </button>
 </form>

 <div class="toolbar">
 ${button("Entrar","auth:login","alt")}
 ${button("Criar conta","auth:signup","alt")}
 ${button("Esqueci a senha","auth:reset","out")}
 </div>
 <p class="small muted">
 Sua conta é protegida por e-mail e senha.
 </p>
 </div>
 </div>`;
}

async function authSubmit(form){
 const fd = new FormData(form);
 const get = name => String(fd.get(name)||"").trim();
 const email = get("email");
 const password = get("password");
 authEmail = email || authEmail;

 if(mode==="signup"){
  if(!/^[0-9]{4}$/.test(get("cpf_last4")))
   throw Error("Informe os 4 últimos dígitos do CPF.");

  const {error} = await db.auth.signUp({
   email,password,
   options:{
    data:{
     full_name:get("name"),
     cpf_last4:get("cpf_last4")
    }
   }
  });
  if(error)throw error;
  mode="login";
  authScreen();
  alertUser("Cadastro solicitado. Confirme seu e-mail.");
  return;
 }

 if(mode==="reset"){
  const {error} = await db.auth.resetPasswordForEmail(email,{
   redirectTo:location.origin+location.pathname
  });
  if(error)throw error;
  alertUser("Confira seu e-mail para recuperar a senha.");
  return;
 }

 if(mode==="recovery"){
  const {error} = await db.auth.updateUser({
   password
  });
  if(error)throw error;
  mode="login";
  alertUser("Senha atualizada.");
  return;
 }

 const {error} = await db.auth.signInWithPassword({
  email,password
 });
 if(error)throw error;
 await initializeUser();
}

/* LEITURA SEGURA DOS DADOS */

async function fetchTable(table,columns="*"){
 const {data,error} = await db.from(table).select(columns);
 if(error)throw error;
 return data||[];
}

async function readData(){
 if(!userId())return;

 dataWarnings=[];

 const {data:own,error:ownErr} = await db
  .from("profiles")
  .select("id,full_name,city,state,postal_code,role")
  .eq("id",userId())
  .maybeSingle();

 if(ownErr)throw ownErr;
 if(!own)throw Error(
  "Seu perfil ainda não está disponível no Supabase."
 );

 profile=own;

 const load = async(table,columns,assign)=>{
  try{
   const result=await fetchTable(table,columns);
   assign(result);
  }catch(e){
   assign([]);
   dataWarnings.push(table+": "+e.message);
  }
 };

 if(isDM()){
  await load(
   "profiles",
   "id,full_name,city,state,postal_code,role",
   v=>profiles=v
  );
 }else{
  profiles=[profile];
 }

 await Promise.all([
  load(
   "actions",
   "id,title,description,start_at,city,state,venue,latitude,longitude,capacity,published,created_by",
   v=>actions=v
  ),
  load(
   "registrations",
   "id,action_id,person_id,status,created_at",
   v=>registrations=v
  ),
  load(
   "exam_results",
   "id,person_id,henna,tintura,lash,skincare,croma,published,updated_at",
   v=>exams=v
  ),
  load(
   "product_shipments",
   "id,person_id,product_name,quantity,shipment_reference,tracking_code,status,sent_at,notes,shipment_type,updated_at",
   v=>shipments=v
  )
 ]);
}

async function refresh(){
 if(!session)return authScreen();
 try{
  await readData();
  render();
 }catch(e){
  $("app").innerHTML=`
  <div class="loginwrap"><div class="login">
  <h1>MENELA</h1>
  <h2>Não foi possível abrir o portal</h2>
  <p>${h(e.message)}</p>
  ${button("Tentar novamente","refresh")}
  ${button("Sair","logout","out")}
  </div></div>`;
 }
}

async function initializeUser(){
 const {data:{session:s}}=await db.auth.getSession();
 session=s;
 if(!session){profile=null;authScreen();return}
 await refresh();
}

/* TELA INICIAL */

function available(a){
 return a.published && new Date(a.start_at)>new Date();
}

function ownRegistration(id){
 return registrations.find(
  r=>r.person_id===userId()&&r.action_id===id
 );
}

function eventCard(a){
 const count=registrations.filter(
  r=>r.action_id===a.id&&r.status==="aprovada"
 ).length;
 const mine=ownRegistration(a.id);
 return `<div class="card">
 ${tag(a.published?"Publicada":"Rascunho",a.published)}
 <h2>${h(a.title)}</h2>
 <p class="small muted">
 ${fmt(a.start_at)} · ${h(a.city)} / ${h(a.state)}
 </p>
 <p>${h(a.venue)}</p>
 <p>${h(a.description)}</p>
 <p class="small">Vagas aprovadas: ${count}/${a.capacity}</p>
 <div class="toolbar">
 ${isDM()?button("Editar","event:"+a.id,"alt"):
 mine?tag("Inscrição "+mine.status):
 available(a)&&count<a.capacity?
 button("Inscrever-me","apply:"+a.id):tag("Indisponível")}
 </div>
 </div>`;
}

/* AGENDA */

function agendaPage(){
 const [y,m]=month.split("-").map(Number);
 const start=new Date(y,m-1,1).getDay();
 const count=new Date(y,m,0).getDate();
 let html="";
 for(let i=1;i<=start;i++)html+=`<div></div>`;
 for(let d=1;d<=count;d++){
  const date=month+"-"+String(d).padStart(2,"0");
  const list=actions.filter(a=>
   new Date(a.start_at).toLocaleDateString("en-CA",{
    timeZone:"America/Sao_Paulo"
   })===date
  );
  html+=`<button class="day ${selectedDate===date?"selected":""}"
  data-day="${date}">
  <b>${d}</b>
  ${list.map(a=>`<small>${h(a.title)}</small>`).join("")}
  </button>`;
 }
 const subset=selectedDate?actions.filter(a=>
  new Date(a.start_at).toLocaleDateString("en-CA",{
   timeZone:"America/Sao_Paulo"
  })===selectedDate
 ):actions;

 return header("Agenda de ações","Calendário MENELA.")+
 `<div class="card">
 <div class="toolbar">
 ${button("‹","prevMonth","alt")}
 <h2>${new Date(y,m-1,1).toLocaleDateString("pt-BR",{

}

/* RESULTADOS DAS PROVAS */

const scoreKeys=["henna","tintura","skincare","lash","croma"];
const scoreLabels=["Henna","Tintura","Lábios e Skincare","Lash","CROMA"];

function examTotal(r){

/* CONTROLE DE ENVIO DE MATERIAIS */

function shipmentGroups(){
 const map=new Map();
 shipments.forEach(s=>{
  const key=s.shipment_reference||s.id;
  if(!map.has(key))map.set(key,[]);
  map.get(key).push(s);
 });
 return [...map.entries()].map(([ref,items])=>({
  ref,items,first:items[0]
 }));
}

function linesFrom(items){
 return items.map(x=>
  Array.isArray(x)?
  x[0]+" | "+x[1]:
  x.product_name+" | "+x.quantity
 ).join("\n");
}

function parseItems(text){
 const rows=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 if(!rows.length||rows.length>100)
  throw Error("Informe de 1 a 100 produtos.");
 return rows.map((row,index)=>{
  const parts=row.split("|");
  const name=(parts[0]||"").trim();
  const quantity=parts.length===1?1:Number(parts[1].trim());
  if(parts.length>2||!name||name.length>150||
     !Number.isInteger(quantity)||quantity<1||quantity>10000){
   throw Error("Produto inválido na linha "+(index+1));
  }
  return {product_name:name,quantity};
 });
}

/* RENDERIZAÇÃO */

function render(){
 if(!session){
  authScreen();
  return;
 }
 if(!profile){
  $("app").textContent="Perfil não disponível.";
  return;
 }
 const adminPages=["people","personForm","examForm","eventForm","shipmentForm"];
 if(!isDM()&&adminPages.includes(page))page="home";

 let content="";
 switch(page){
  case "home":content=homePage();break;
  case "agenda":content=agendaPage();break;
  case "near":content=nearPage();break;
  case "people":content=peoplePage();break;
  case "apps":content=registrationPage();break;
  case "exams":content=examsPage();break;
  case "examForm":content=examForm();break;
  case "shipments":content=shipmentsPage();break;
  case "shipmentForm":content=shipmentForm();break;
  case "profile":content=profileForm();break;
  case "personForm":content=profileForm();break;
  case "eventForm":content=eventForm();break;
  default:content=homePage();
 }
 shell(content);
}

function go(target){
 page=target;
 render();
}

/* AÇÕES DOS BOTÕES */

document.addEventListener("click",async e=>{
 const nav=e.target.closest("[data-nav]");
 if(nav){go(nav.dataset.nav);return;}

 const day=e.target.closest("[data-day]");
 if(day){
  selectedDate=day.dataset.day;
  render();
  return;
 }

 const el=e.target.closest("[data-action]");
 if(!el)return;
 const action=el.dataset.action;

 try{
 if(action.startsWith("auth:")){
  mode=action.split(":")[1];
  authScreen();
  return;
 }

 if(action==="logout"){
  await db.auth.signOut();
  session=null;
  profile=null;
  mode="login";
  page="home";
  authScreen();
  return;
 }

 if(action==="refresh"){
  await initializeUser();
  return;
 }

 if(!session)return;

 if(["home","agenda","near","people","apps","exams","shipments","profile"].includes(action)){
  go(action);
  return;
 }

 if(action==="newEvent"&&isDM()){
  editId=null;
  go("eventForm");
  return;
 }

 if(action==="newShipment"&&isDM()){
  shipmentRef=null;
  go("shipmentForm");
  return;
 }

 if(action.startsWith("event:")&&isDM()){
  editId=action.slice(6);
  go("eventForm");
  return;
 }

 if(action.startsWith("exam:")&&isDM()){
  editId=action.slice(5);
  go("examForm");
  return;
 }

 if(action.startsWith("person:")&&isDM()){
  editId=action.slice(7);
  go("personForm");
  return;
 }

 if(action.startsWith("shipment:")&&isDM()){
  shipmentRef=action.slice(9);
  go("shipmentForm");
  return;
 }

 if(action==="prevMonth"||action==="nextMonth"){
  const [y,m]=month.split("-").map(Number);
  const offset=action==="nextMonth"?1:-1;
  const d=new Date(y,m-1+offset,1);
  month=d.getFullYear()+"-"+
   String(d.getMonth()+1).padStart(2,"0");
  selectedDate="";
  render();
  return;
 }

 if(action==="clearDay"){
  selectedDate="";
  render();
  return;
 }

 if(action.startsWith("apply:")&&!isDM()){
  const id=action.slice(6);
  const a=actions.find(x=>x.id===id);
  if(!a||!available(a))throw Error("Ação indisponível.");
  const {error}=await db.from("registrations").insert({
   action_id:id,
   person_id:userId(),
   status:"pendente"
  });
  if(error)throw error;
  await refresh();
  alertUser("Inscrição enviada para análise.");
  return;
 }

 if((action.startsWith("approve:")||
     action.startsWith("reject:"))&&isDM()){
  const approved=action.startsWith("approve:");
  const id=action.split(":")[1];
  const {error}=await db.from("registrations")
   .update({status:approved?"aprovada":"recusada"})
   .eq("id",id);
  if(error)throw error;
  await refresh();
  return;
 }

 }catch(err){
  alertUser(err.message,true);
 }
});

document.addEventListener("change",e=>{
 if(e.target.id==="shipmentType"){
  const area=$("shipmentItems");
  if(area){
   area.value=e.target.value==="curso_henna"?
    linesFrom(cursoHenna):"";
  }
 }
});

/* SALVAMENTO DOS FORMULÁRIOS */

document.addEventListener("submit",async e=>{
 const form=e.target;
 if(![
  "authForm","examForm","shipmentForm",
  "profileForm","eventForm"
 ].includes(form.id))return;

 e.preventDefault();
 if(busy)return;
 busy=true;

 const fd=new FormData(form);
 const get=k=>String(fd.get(k)||"").trim();

 try{
 if(form.id==="authForm"){
  await authSubmit(form);
  return;
 }

 if(!session||!profile)throw Error("Acesso não autorizado.");

 if(form.id==="examForm"&&isDM()){
  const values={};
  for(const key of scoreKeys){
   const raw=get(key).replace(",",".");
   const number=Number(raw);
   if(raw===""||!Number.isFinite(number)||
      number<0||number>10||
      Math.abs(Math.round(number*100)-number*100)>0.000001){
    throw Error("As notas devem ser de 0 a 10, com até duas casas decimais.");
   }
   values[key]=number;
  }

  values.published=fd.has("published");
  values.updated_at=new Date().toISOString();

  const existing=exams.find(r=>r.person_id===editId);

  let result;
  if(existing){
   result=await db.from("exam_results")
    .update(values)
    .eq("person_id",editId);
  }else{
   result=await db.from("exam_results")
    .insert({...values,person_id:editId});
  }
  if(result.error)throw result.error;
  page="exams";
  await refresh();
  alertUser("Notas salvas.");
  return;
 }

 if(form.id==="shipmentForm"&&isDM()){
  const person=get("person_id");
  if(!profiles.some(p=>p.id===person&&p.role==="menetecnica"))
   throw Error("Selecione uma Menetécnica cadastrada.");

  const type=get("shipment_type");
  const status=get("status");
  const items=parseItems(get("items"));

  if(!["soltos","curso_henna"].includes(type))
   throw Error("Tipo inválido.");

  if(!["preparando","enviado","entregue","cancelado"].includes(status))
   throw Error("Status inválido.");

  const reference=shipmentRef||
    "MENELA-"+crypto.randomUUID();

  const payload={
   p_reference:reference,
   p_person_id:person,
   p_type:type,
   p_sent_at:get("sent_at")||null,
   p_status:status,
   p_tracking:get("tracking_code")||null,
   p_notes:get("notes")||null,
   p_items:items
  };

  const {error}=await db.rpc(
   "menela_save_shipment",
   payload
  );
  if(error)throw error;

  shipmentRef=null;
  page="shipments";
  await refresh();
  alertUser("Envio registrado.");
  return;
 }

 if(form.id==="profileForm"){
  const editing=page==="personForm"&&isDM();
  const target=editing?editId:userId();
  const patch={
   full_name:get("full_name"),
   city:get("city"),
   state:get("state"),
   postal_code:get("postal_code")
  };
  const {error}=await db.from("profiles")
   .update(patch).eq("id",target);
  if(error)throw error;
  page=editing?"people":"profile";
  await refresh();
  alertUser("Cadastro atualizado.");
  return;
 }

 if(form.id==="eventForm"&&isDM()){
  const lat=get("latitude");
  const lon=get("longitude");
  if(Boolean(lat)!==Boolean(lon))
   throw Error("Informe latitude e longitude juntas.");

  const data={
   title:get("title"),
   start_at:get("start")+":00-03:00",
   capacity:Number(get("capacity")),
   city:get("city"),
   state:get("state"),
   venue:get("venue"),
   latitude:lat?Number(lat):null,
   longitude:lon?Number(lon):null,
   description:get("description"),
   published:fd.has("published")
  };

  const result=editId?
   await db.from("actions").update(data).eq("id",editId):
   await db.from("actions").insert({
    ...data,created_by:userId()
   });

  if(result.error)throw result.error;
  page="agenda";
  await refresh();
  alertUser("Ação salva.");
  return;
 }

 }catch(err){
  alertUser(err.message,true);
 }finally{
  busy=false;
 }
});

/* INICIALIZAÇÃO */

async function boot(){
 if(!db){
  $("app").innerHTML=
  '<div class="loginwrap"><div class="login">'+
  '<h2>Falha ao carregar a conexão Supabase</h2>'+
  '<p>Verifique sua conexão com a internet.</p>'+
  '</div></div>';
  return;
 }

 db.auth.onAuthStateChange((event)=>{
  if(event==="PASSWORD_RECOVERY"){
   mode="recovery";
   authScreen();
  }else if(event==="SIGNED_OUT"){
   session=null;
   profile=null;
   authScreen();
  }
 });

 await initializeUser();

 if(location.hash.includes("type=recovery")){
  mode="recovery";
  authScreen();
 }
}

boot().catch(err=>{
 $("app").innerHTML=
 '<div class="loginwrap"><div class="login">'+
 '<h1>MENELA</h1>'+
 '<h2>Erro de inicialização</h2>'+
 '<p>'+h(err.message)+'</p>'+
 '</div></div>';
});
</script>
